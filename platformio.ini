[platformio]
lib_dir = lib
src_dir = src
extra_configs = platformio_extra.ini

; Silvia-only fork: NodeMCU (ESP8266) only. Build with tools/flash/flash-silvia.sh --build
; (the xtensa toolchain of espressif8266 2.6.x is x86-only and runs in Docker).
[env]
lib_deps =
    lebuni/ZACwire for TSic @ 2.0.0
    olikraus/U8g2 @ 2.34.5
    git+https://github.com/rancilio-pid/Arduino-PID-Library
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 6.19.4
    git+https://github.com/me-no-dev/ESPAsyncWebServer#f71e3d4

[env:nodemcuv2_usb]
platform = espressif8266 @^2.6.3
board = nodemcuv2
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; OTA uploads are done by tools/flash/flash-silvia.sh (espota.py from the Mac, password prompted)
[env:nodemcuv2_ota]
platform = espressif8266 @^2.6.3
board = nodemcuv2
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200

; host-side unit tests: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_compat_mode = off
lib_deps =
    git+https://github.com/rancilio-pid/Arduino-PID-Library
build_flags =
    -std=c++17
    -DARDUINO=100
    -DUNITY_INCLUDE_DOUBLE
    -Itest/stubs
    -Isrc
