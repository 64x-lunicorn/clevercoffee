name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Native tests
        run: pio test -e native
      - name: Firmware build (placeholder config)
        run: |
          cp tools/flash/userConfig.silvia.h src/userConfig.h
          pio run -e nodemcuv2_ota
